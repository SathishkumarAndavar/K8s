<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kubernetes controller and webhook workflow diagram">
  <style>
    .box { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 14; }
    .inner { fill: #ffffff; stroke: #4f46e5; stroke-width: 1.5; rx: 10; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <rect x="30" y="30" width="900" height="580" rx="20" fill="#f8fafc" />
  <text class="title" x="480" y="70" text-anchor="middle">Kubernetes Controller + Admission Webhook Workflow</text>

  <rect x="80" y="110" width="220" height="120" class="box" />
  <text class="text" x="190" y="150">Client / kubectl</text>
  <text class="text" x="190" y="170">API request</text>

  <rect x="340" y="110" width="240" height="120" class="box" />
  <text class="text" x="460" y="145">API Server</text>
  <text class="text" x="460" y="165">AuthN / AuthZ</text>
  <text class="text" x="460" y="185">Admission pipeline</text>

  <rect x="620" y="110" width="220" height="120" class="box" />
  <text class="text" x="730" y="145">etcd</text>
  <text class="text" x="730" y="170">Persist desired state</text>

  <rect x="80" y="280" width="220" height="120" class="box" />
  <text class="text" x="190" y="310">Mutating</text>
  <text class="text" x="190" y="330">Admission Webhook</text>

  <rect x="340" y="280" width="240" height="120" class="box" />
  <text class="text" x="460" y="310">Validating</text>
  <text class="text" x="460" y="330">Admission Webhook</text>

  <rect x="620" y="280" width="220" height="120" class="box" />
  <text class="text" x="730" y="310">Controller Manager</text>
  <text class="text" x="730" y="330">ReplicaSet / Deployment</text>

  <rect x="340" y="460" width="240" height="120" class="box" />
  <text class="text" x="460" y="490">Worker Node</text>
  <text class="text" x="460" y="510">kubelet + runtime</text>

  <line class="arrow" x1="150" y1="230" x2="340" y2="230" />
  <line class="arrow" x1="580" y1="230" x2="620" y2="230" />

  <line class="arrow" x1="200" y1="280" x2="200" y2="240" />
  <line class="arrow" x1="200" y1="240" x2="400" y2="240" />
  <line class="arrow" x1="400" y1="240" x2="400" y2="280" />

  <line class="arrow" x1="420" y1="400" x2="420" y2="320" />
  <line class="arrow" x1="420" y1="400" x2="630" y2="400" />
  <line class="arrow" x1="630" y1="400" x2="630" y2="320" />

  <line class="arrow" x1="570" y1="340" x2="570" y2="460" />

  <text class="text" x="480" y="260" text-anchor="middle">Admission flow</text>
  <text class="text" x="520" y="380" text-anchor="middle">Desired state persists, controllers reconcile</text>
  <text class="text" x="520" y="540" text-anchor="middle">Node receives pod scheduling event and creates containers</text>
</svg>
