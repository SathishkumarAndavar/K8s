<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leader election diagram">
  <style>
    .box { fill: #eef2ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <text class="title" x="480" y="40" text-anchor="middle">Leader Election</text>
  <rect x="80" y="100" width="220" height="120" class="box" />
  <text class="text" x="190" y="140" text-anchor="middle" font-weight="bold">Instance A</text>
  <text class="text" x="190" y="160" text-anchor="middle">acquires lock</text>
  <rect x="360" y="100" width="220" height="120" class="box" />
  <text class="text" x="470" y="140" text-anchor="middle" font-weight="bold">API Server</text>
  <text class="text" x="470" y="160" text-anchor="middle">stores lock object</text>
  <rect x="640" y="100" width="220" height="120" class="box" />
  <text class="text" x="750" y="140" text-anchor="middle" font-weight="bold">Instance B</text>
  <text class="text" x="750" y="160" text-anchor="middle">waits for lock</text>
  <line class="arrow" x1="300" y1="160" x2="360" y2="160" />
  <line class="arrow" x1="580" y1="160" x2="640" y2="160" />
</svg>
