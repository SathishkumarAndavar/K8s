<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pod lifecycle diagram">
  <style>
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <text class="title" x="480" y="40" text-anchor="middle">Pod Lifecycle</text>
  <rect x="100" y="100" width="220" height="120" class="box" />
  <text class="text" x="210" y="140" text-anchor="middle" font-weight="bold">Pending</text>
  <text class="text" x="210" y="160" text-anchor="middle">unscheduled or starting</text>
  <rect x="360" y="100" width="220" height="120" class="box" />
  <text class="text" x="470" y="140" text-anchor="middle" font-weight="bold">Running</text>
  <text class="text" x="470" y="160" text-anchor="middle">pod is active</text>
  <rect x="620" y="100" width="220" height="120" class="box" />
  <text class="text" x="730" y="140" text-anchor="middle" font-weight="bold">Terminating</text>
  <text class="text" x="730" y="160" text-anchor="middle">deletion in progress</text>
  <line class="arrow" x1="320" y1="160" x2="360" y2="160" />
  <line class="arrow" x1="580" y1="160" x2="620" y2="160" />
  <rect x="360" y="280" width="220" height="120" class="box" />
  <text class="text" x="470" y="320" text-anchor="middle" font-weight="bold">Succeeded / Failed</text>
  <text class="text" x="470" y="340" text-anchor="middle">pod completed</text>
  <line class="arrow" x1="470" y1="220" x2="470" y2="280" />
</svg>
