<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kubelet versus scheduler diagram">
  <style>
    .box { fill: #eef2ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <text class="title" x="480" y="40" text-anchor="middle">kubelet vs Scheduler</text>
  <rect x="105" y="100" width="240" height="120" class="box" />
  <text class="text" x="225" y="140" text-anchor="middle" font-weight="bold">Scheduler</text>
  <text class="text" x="225" y="160" text-anchor="middle">Chooses node for pod</text>
  <text class="text" x="225" y="180" text-anchor="middle">Writes pod.spec.nodeName</text>
  <rect x="615" y="100" width="240" height="120" class="box" />
  <text class="text" x="735" y="140" text-anchor="middle" font-weight="bold">kubelet</text>
  <text class="text" x="735" y="160" text-anchor="middle">Manages pod lifecycle</text>
  <text class="text" x="735" y="180" text-anchor="middle">Starts containers on node</text>
  <rect x="360" y="300" width="240" height="120" class="box" />
  <text class="text" x="480" y="340" text-anchor="middle" font-weight="bold">API Server</text>
  <text class="text" x="480" y="360" text-anchor="middle">Shared state and watch API</text>
  <line class="arrow" x1="325" y1="180" x2="615" y2="180" />
  <line class="arrow" x1="360" y1="250" x2="360" y2="300" />
  <line class="arrow" x1="620" y1="250" x2="620" y2="300" />
</svg>
