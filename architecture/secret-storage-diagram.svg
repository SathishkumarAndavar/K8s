<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secret storage diagram">
  <style>
    .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <text class="title" x="480" y="40" text-anchor="middle">Secret Storage Flow</text>
  <rect x="100" y="100" width="240" height="120" class="box" />
  <text class="text" x="220" y="140" text-anchor="middle" font-weight="bold">API Server</text>
  <text class="text" x="220" y="160" text-anchor="middle">stores Secret object</text>
  <rect x="620" y="100" width="240" height="120" class="box" />
  <text class="text" x="740" y="140" text-anchor="middle" font-weight="bold">etcd</text>
  <text class="text" x="740" y="160" text-anchor="middle">stores Secret data</text>
  <line class="arrow" x1="340" y1="160" x2="620" y2="160" />
  <rect x="360" y="320" width="240" height="120" class="box" />
  <text class="text" x="480" y="360" text-anchor="middle" font-weight="bold">kubelet</text>
  <text class="text" x="480" y="380" text-anchor="middle">mounts Secret into pod</text>
  <line class="arrow" x1="480" y1="220" x2="480" y2="320" />
</svg>
