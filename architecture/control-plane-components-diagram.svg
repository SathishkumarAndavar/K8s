<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Control plane components diagram">
  <style>
    .box { fill: #eef2ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <text class="title" x="480" y="40" text-anchor="middle">Control Plane Components</text>
  <rect x="60" y="90" width="260" height="140" class="box" />
  <text class="text" x="190" y="130" text-anchor="middle">kube-apiserver</text>
  <text class="text" x="190" y="150" text-anchor="middle">AuthN/AuthZ, validation, etcd write</text>
  <rect x="360" y="90" width="260" height="140" class="box" />
  <text class="text" x="490" y="130" text-anchor="middle">etcd</text>
  <text class="text" x="490" y="150" text-anchor="middle">Cluster state store</text>
  <rect x="660" y="90" width="260" height="140" class="box" />
  <text class="text" x="790" y="130" text-anchor="middle">kube-controller-manager</text>
  <text class="text" x="790" y="150" text-anchor="middle">Reconcile controllers</text>
  <rect x="360" y="280" width="260" height="140" class="box" />
  <text class="text" x="490" y="320" text-anchor="middle">kube-scheduler</text>
  <text class="text" x="490" y="340" text-anchor="middle">Assign pods to nodes</text>
  <line class="arrow" x1="190" y1="230" x2="190" y2="280" />
  <line class="arrow" x1="490" y1="230" x2="490" y2="280" />
  <line class="arrow" x1="790" y1="230" x2="790" y2="280" />
  <line class="arrow" x1="330" y1="160" x2="360" y2="160" />
  <line class="arrow" x1="620" y1="160" x2="660" y2="160" />
  <line class="arrow" x1="470" y1="220" x2="470" y2="280" />
</svg>
