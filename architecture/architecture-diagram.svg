<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kubernetes architecture diagram">
  <style>
    .box { fill: #f0f7ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
    .inner-box { fill: #ffffff; stroke: #1d4ed8; stroke-width: 1; rx: 10; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #111827; }
    .title { font-size: 18px; font-weight: bold; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <rect x="40" y="40" width="880" height="520" rx="20" fill="#e2e8f0" />
  <text class="title" x="480" y="70" text-anchor="middle">Kubernetes Cluster Architecture</text>

  <rect x="100" y="110" width="760" height="220" class="box" />
  <text class="title" x="480" y="140" text-anchor="middle">Control Plane</text>

  <rect x="140" y="170" width="170" height="120" class="inner-box" />
  <text class="text" x="225" y="200" text-anchor="middle">API Server</text>
  <text class="text" x="225" y="220" text-anchor="middle">kube-apiserver</text>

  <rect x="340" y="170" width="170" height="120" class="inner-box" />
  <text class="text" x="425" y="200" text-anchor="middle">etcd</text>
  <text class="text" x="425" y="220" text-anchor="middle">Cluster state store</text>

  <rect x="540" y="170" width="170" height="120" class="inner-box" />
  <text class="text" x="625" y="200" text-anchor="middle">Controller Manager</text>
  <text class="text" x="625" y="220" text-anchor="middle">kube-controller-manager</text>

  <rect x="740" y="170" width="170" height="120" class="inner-box" />
  <text class="text" x="825" y="200" text-anchor="middle">Scheduler</text>
  <text class="text" x="825" y="220" text-anchor="middle">kube-scheduler</text>

  <rect x="160" y="380" width="640" height="160" class="box" />
  <text class="title" x="480" y="410" text-anchor="middle">Worker Nodes</text>

  <rect x="180" y="450" width="180" height="90" class="inner-box" />
  <text class="text" x="270" y="480" text-anchor="middle">Node 1</text>
  <text class="text" x="270" y="500" text-anchor="middle">kubelet + runtime</text>
  <text class="text" x="270" y="520" text-anchor="middle">kube-proxy</text>

  <rect x="390" y="450" width="180" height="90" class="inner-box" />
  <text class="text" x="480" y="480" text-anchor="middle">Node 2</text>
  <text class="text" x="480" y="500" text-anchor="middle">kubelet + runtime</text>
  <text class="text" x="480" y="520" text-anchor="middle">kube-proxy</text>

  <rect x="600" y="450" width="180" height="90" class="inner-box" />
  <text class="text" x="690" y="480" text-anchor="middle">Node 3</text>
  <text class="text" x="690" y="500" text-anchor="middle">kubelet + runtime</text>
  <text class="text" x="690" y="520" text-anchor="middle">kube-proxy</text>

  <line class="arrow" x1="280" y1="290" x2="280" y2="380" />
  <line class="arrow" x1="480" y1="290" x2="480" y2="450" />
  <line class="arrow" x1="680" y1="290" x2="680" y2="450" />

  <text class="text" x="480" y="560" text-anchor="middle">Pod scheduling, state reconciliation, service discovery, and orchestration flow</text>
</svg>
