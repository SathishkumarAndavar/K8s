<svg width="960" height="520" viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ConfigMap update flow diagram">
  <style>
    .box { fill: #eef2ff; stroke: #1d4ed8; stroke-width: 2; rx: 14; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #0f172a; }
    .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .arrow { fill: none; stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#0f172a" />
    </marker>
  </defs>
  <text class="title" x="480" y="40" text-anchor="middle">ConfigMap Update Flow</text>
  <rect x="80" y="100" width="240" height="120" class="box" />
  <text class="text" x="200" y="140" text-anchor="middle" font-weight="bold">Update ConfigMap</text>
  <text class="text" x="200" y="160" text-anchor="middle">`kubectl apply`</text>
  <rect x="380" y="100" width="240" height="120" class="box" />
  <text class="text" x="500" y="140" text-anchor="middle" font-weight="bold">API Server</text>
  <text class="text" x="500" y="160" text-anchor="middle">writes to etcd</text>
  <rect x="680" y="100" width="240" height="120" class="box" />
  <text class="text" x="800" y="140" text-anchor="middle" font-weight="bold">Kubelet</text>
  <text class="text" x="800" y="160" text-anchor="middle">refreshes mounted files</text>
  <line class="arrow" x1="320" y1="160" x2="380" y2="160" />
  <line class="arrow" x1="620" y1="160" x2="680" y2="160" />
</svg>
