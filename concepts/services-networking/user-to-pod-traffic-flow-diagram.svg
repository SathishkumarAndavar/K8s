<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="External user traffic flowing to a Kubernetes Pod">
  <style>.edge{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:12}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.pod{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:12}.text{font-family:Arial,sans-serif;font-size:14px;fill:#0f172a}.title{font-family:Arial,sans-serif;font-size:20px;font-weight:bold;fill:#0f172a}.arrow{fill:none;stroke:#0f172a;stroke-width:2;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7Z" fill="#0f172a"/></marker></defs>
  <text class="title" x="550" y="38" text-anchor="middle">External User-to-Pod Traffic Flow</text>
  <rect class="edge" x="30" y="135" width="120" height="85"/><text class="text" x="90" y="170" text-anchor="middle">User</text><text class="text" x="90" y="192" text-anchor="middle">DNS lookup</text>
  <rect class="edge" x="205" y="135" width="155" height="85"/><text class="text" x="282" y="170" text-anchor="middle">Public load balancer</text><text class="text" x="282" y="192" text-anchor="middle">TLS / HTTP entry</text>
  <rect class="box" x="415" y="135" width="160" height="85"/><text class="text" x="495" y="170" text-anchor="middle">Ingress / Gateway</text><text class="text" x="495" y="192" text-anchor="middle">controller data plane</text>
  <rect class="box" x="630" y="135" width="120" height="85"/><text class="text" x="690" y="170" text-anchor="middle">Service</text><text class="text" x="690" y="192" text-anchor="middle">stable virtual IP</text>
  <rect class="box" x="805" y="135" width="125" height="85"/><text class="text" x="867" y="170" text-anchor="middle">EndpointSlice</text><text class="text" x="867" y="192" text-anchor="middle">ready Pod IPs</text>
  <rect class="pod" x="975" y="135" width="95" height="85"/><text class="text" x="1022" y="170" text-anchor="middle">Pod</text><text class="text" x="1022" y="192" text-anchor="middle">container port</text>
  <line class="arrow" x1="150" y1="177" x2="205" y2="177"/><line class="arrow" x1="360" y1="177" x2="415" y2="177"/><line class="arrow" x1="575" y1="177" x2="630" y2="177"/><line class="arrow" x1="750" y1="177" x2="805" y2="177"/><line class="arrow" x1="930" y1="177" x2="975" y2="177"/>
  <rect class="box" x="335" y="290" width="430" height="62"/><text class="text" x="550" y="317" text-anchor="middle">In-cluster: client Pod → Service DNS / ClusterIP → Service routing → ready endpoint</text><text class="text" x="550" y="338" text-anchor="middle">NetworkPolicy, cloud firewall, and mesh policy can block separate layers.</text>
</svg>
