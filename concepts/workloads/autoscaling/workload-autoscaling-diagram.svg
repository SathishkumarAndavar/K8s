<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kubernetes workload autoscaling flow">
  <style>.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}.vpa{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:12}.text{font-family:Arial,sans-serif;font-size:14px;fill:#0f172a}.title{font-family:Arial,sans-serif;font-size:19px;font-weight:bold;fill:#0f172a}.arrow{fill:none;stroke:#0f172a;stroke-width:2;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><path d="M0 0 L10 3.5 L0 7Z" fill="#0f172a"/></marker></defs>
  <text class="title" x="480" y="36" text-anchor="middle">Workload Autoscaling: HPA and VPA</text>
  <rect class="box" x="55" y="105" width="190" height="90"/><text class="text" x="150" y="142" text-anchor="middle">Metrics Server /</text><text class="text" x="150" y="164" text-anchor="middle">custom metrics API</text>
  <rect class="box" x="360" y="80" width="220" height="100"/><text class="text" x="470" y="120" text-anchor="middle">HPA controller</text><text class="text" x="470" y="145" text-anchor="middle">calculates replicas</text>
  <rect class="vpa" x="360" y="220" width="220" height="100"/><text class="text" x="470" y="260" text-anchor="middle">VPA recommender</text><text class="text" x="470" y="285" text-anchor="middle">recommends CPU / memory</text>
  <rect class="box" x="710" y="105" width="195" height="90"/><text class="text" x="807" y="142" text-anchor="middle">Deployment / StatefulSet</text><text class="text" x="807" y="164" text-anchor="middle">creates or resizes Pods</text>
  <line class="arrow" x1="245" y1="140" x2="360" y2="130"/><line class="arrow" x1="245" y1="180" x2="360" y2="260"/><line class="arrow" x1="580" y1="130" x2="710" y2="145"/><line class="arrow" x1="580" y1="270" x2="710" y2="170"/>
  <text class="text" x="480" y="345" text-anchor="middle">HPA changes replica count; VPA changes resource requests (often through replacement Pods).</text>
</svg>
